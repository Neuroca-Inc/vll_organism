[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vll-organism"
version = "0.1.0"
description = "A local, vector-database-free memory system: idles in the background, integrates new corpora by relaxing back toward homeostasis after perturbation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vll-organism = "vll_organism.cli:main"

[tool.setuptools]
packages = ["vll_organism"]
